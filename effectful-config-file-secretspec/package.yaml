---
name: effectful-config-file-secretspec
version: 0.1.0.0
license: BSD-3-Clause
author: drlkf
maintainer: drlkf@drlkf.net
copyright: 2026 drlkf

extra-source-files:
  - README.md

extra-docs-files:
  - CHANGELOG.md

category: Configuration
synopsis: SecretSpec backend for effectful-config-file
description: >-
  SecretSpec-backed Secrets effect handler for effectful-config-file

build-tools:
  - hspec-discover

dependencies:
  - base >= 4.7 && < 5
  - containers >= 0.2 && < 1
  - effectful >= 2.6 && < 3
  - effectful-config-file >= 0.1 && < 2
  - secretspec >= 0.21 && < 1
  - text >= 2.1 && < 3

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-config-file-secretspec-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

    dependencies:
      - effectful-config-file-secretspec
      - filepath
      - hspec
      - lens
      - temporary
