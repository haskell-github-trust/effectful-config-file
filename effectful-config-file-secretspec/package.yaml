---
name: effectful-config-file-secretspec
version: 0.1.0.0
license: GPL-3
author: drlkf
maintainer: drlkf@drlkf.net
copyright: 2024 drlkf

extra-source-files:
  - README.md
  - CHANGELOG.md

description: >-
  SecretSpec-backed Secrets effect handler for effectful-config-file

build-tools:
  - hspec-discover

dependencies:
  - base >= 4.7 && < 5
  - containers
  - effectful
  - effectful-config-file
  - secretspec
  - text

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-config-file-secretspec-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Werror

    dependencies:
      - effectful-config-file-secretspec
      - filepath
      - hspec
      - lens
      - temporary
