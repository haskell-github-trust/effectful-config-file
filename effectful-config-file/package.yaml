---
name: effectful-config-file
version: 0.1.0.0
license: GPL-3
author: drlkf
maintainer: drlkf@drlkf.net
copyright: 2024 drlkf

extra-source-files:
  - README.md
  - CHANGELOG.md

description: >-
  Config-file parser and utilities to use in conjunction with effectful

build-tools:
  - hspec-discover

dependencies:
  - base >= 4.7 && < 5
  - bytestring
  - directory
  - effectful
  - filepath
  - hs-opentelemetry-api
  - lens
  - megaparsec
  - monad-logger
  - parser-combinators
  - text
  - toml-parser

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-config-file-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Werror

    dependencies:
      - effectful-config-file
      - hspec
      - hs-opentelemetry-api
      - hs-opentelemetry-sdk
      - hs-opentelemetry-exporter-in-memory
      - hs-opentelemetry-instrumentation-monad-logger
      - temporary
