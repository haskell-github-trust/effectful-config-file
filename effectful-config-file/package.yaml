---
name: effectful-config-file
version: 0.1.1.0
license: BSD-3-Clause
author: drlkf
maintainer: drlkf@drlkf.net
copyright: 2026 drlkf

extra-source-files:
  - README.md

extra-doc-files:
  - CHANGELOG.md

category: Configuration
synopsis: Config-file effect for effectful
description: >-
  Config-file parser and utilities to use in conjunction with effectful

build-tools:
  - hspec-discover

dependencies:
  - base >= 4.7 && < 5
  - bytestring >= 0.12 && < 1
  - directory >= 1.3 && < 2
  - effectful >= 2.6 && < 3
  - filepath >= 1.5 && < 2
  - hs-opentelemetry-api >= 1 && < 2
  - lens >= 5.3 && < 6
  - megaparsec >= 9.7 && < 10
  - monad-logger >= 0.3 && < 1
  - parser-combinators >= 1.3 && < 2
  - text >= 2.1 && < 3
  - toml-parser >= 2 && < 3

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  effectful-config-file-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

    dependencies:
      - effectful-config-file
      - hspec
      - hs-opentelemetry-api
      - hs-opentelemetry-sdk
      - hs-opentelemetry-exporter-in-memory
      - hs-opentelemetry-instrumentation-monad-logger
      - temporary
