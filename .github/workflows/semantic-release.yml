name: semantic-release

on:
  workflow_run:
    workflows: [stack-build]
    types: [completed]
    branches: [main]

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: "${{ secrets.SEMANTIC_RELEASE_APP_ID }}"
          private-key: "${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}"

      # semantic-release-haddock-since builds effectful-config-file-secretspec
      - uses: ./.github/actions/libsecretspec

      - uses: actions/cache@v6
        with:
          path: |
            ~/.stack
            .stack-work
            effectful-config-file/.stack-work
            effectful-config-file-secretspec/.stack-work
          key: release-stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '*/package.yaml', '*/*.cabal') }}
          restore-keys: release-stack-${{ runner.os }}-

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8.1.3
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/changelog
            @semantic-release/git
            semantic-release-haddock-since@https://github.com/haskell-github-trust/semantic-release-haddock-since/releases/download/1.0.0/semantic-release-haddock-since-1.0.0.tgz

      - name: Semantic release output
        env:
          RELEASE_NOTES: "${{ steps.semantic.outputs.new_release_notes }}"
        run: |
          echo ref: ${{ github.ref }}
          echo published: ${{ steps.semantic.outputs.new_release_published }}
          echo last_release: ${{ steps.semantic.outputs.last_release_version }}
          echo new_version: ${{ steps.semantic.outputs.new_release_version }}
          echo git_head: ${{ steps.semantic.outputs.new_release_git_head }}

          echo release_notes:
          echo "$RELEASE_NOTES"
